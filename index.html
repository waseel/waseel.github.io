<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a12" />

  <title>WADTD!!</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090a12;
      --card: rgba(19, 21, 37, 0.88);
      --border: rgba(139, 92, 246, 0.25);
      --text: #f5f3ff;
      --muted: #9698b3;
      --cyan: #55e7ff;
      --violet: #a78bfa;
      --pink: #f472b6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(
          ellipse at 15% 15%,
          rgba(124, 58, 237, 0.16),
          transparent 42%
        ),
        radial-gradient(
          ellipse at 85% 85%,
          rgba(6, 182, 212, 0.12),
          transparent 42%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: min(680px, 100%);
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 38px;
    }

    /* Minimal animated heartbeat */
    .heartbeat {
      position: relative;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
    }

    .heartbeat::before,
    .heartbeat::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(85, 231, 255, 0.4);
      border-radius: 50%;
      animation: ripple 2.4s ease-out infinite;
    }

    .heartbeat::after {
      animation-delay: 1.2s;
    }

    .heart {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow:
        0 0 10px rgba(85, 231, 255, 0.9),
        0 0 25px rgba(85, 231, 255, 0.5);
      animation: beat 1.2s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 46px);
      font-weight: 700;
      letter-spacing: -0.06em;
      color: var(--text);
    }

    h1 span {
      background: linear-gradient(
        110deg,
        var(--cyan),
        var(--violet) 55%,
        var(--pink)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .unit {
      min-width: 0;
      padding: 26px 8px 23px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .unit:nth-child(1) {
      --glow: var(--violet);
    }

    .unit:nth-child(2) {
      --glow: var(--cyan);
    }

    .unit:nth-child(3) {
      --glow: var(--pink);
    }

    .unit:nth-child(4) {
      --glow: var(--violet);
    }

    .unit:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--glow) 65%, transparent);
      box-shadow: 0 8px 30px color-mix(
        in srgb, var(--glow) 9%, transparent
      );
    }

    .number {
      display: block;
      font-size: clamp(25px, 5.5vw, 39px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
      color: var(--glow, var(--text));
      text-shadow: 0 0 22px color-mix(
        in srgb, var(--glow, var(--text)) 18%, transparent
      );
    }

    .label {
      display: block;
      margin-top: 13px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      15% {
        transform: scale(1.5);
      }

      30% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.25);
      }

      60% {
        transform: scale(1);
        opacity: 0.85;
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(0.65);
        opacity: 0.7;
      }

      100% {
        transform: scale(1.7);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .header {
        margin-bottom: 30px;
      }

      .timer {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
      }

      .unit {
        padding: 25px 8px 21px;
      }

      .number {
        font-size: 35px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="heartbeat" aria-hidden="true">
        <span class="heart"></span>
      </div>

      <h1>WADTD<span>!!</span></h1>
    </header>

    <section class="timer" aria-label="Elapsed time">
      <div class="unit">
        <span class="number" id="days">0</span>
        <span class="label">Days</span>
      </div>

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>
  </main>

  <script>
    // 14 October 2026, 04:13:00 AM IST (UTC+05:30)
    const START_TIME = new Date(
      "2026-10-14T04:13:00+05:30"
    ).getTime();

    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    const pad = value => String(value).padStart(2, "0");

    function updateTimer() {
      const elapsed = Math.max(0, Date.now() - START_TIME);
      const totalSeconds = Math.floor(elapsed / 1000);

      elements.days.textContent =
        Math.floor(totalSeconds / 86400);

      elements.hours.textContent =
        pad(Math.floor((totalSeconds % 86400) / 3600));

      elements.minutes.textContent =
        pad(Math.floor((totalSeconds % 3600) / 60));

      elements.seconds.textContent =
        pad(totalSeconds % 60);
    }

    function scheduleNextUpdate() {
      updateTimer();

      // Align updates with the next real second.
      const delay = 1000 - (Date.now() % 1000);
      setTimeout(scheduleNextUpdate, delay);
    }

    scheduleNextUpdate();
  </script>
</body>
</html>
