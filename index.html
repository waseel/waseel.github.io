
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#180707">
  <title>Siempre</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #180707;
      --surface: #260b0b;
      --text: #f4e8e8;
      --muted: #b99b9b;
      --accent: #c74343;
      --border: #512020;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .subtitle {
      margin: 0 0 42px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .timer-section {
      margin-bottom: 42px;
    }

    .section-label {
      margin-bottom: 14px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    #elapsed {
      font-size: clamp(1.35rem, 5vw, 2.2rem);
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }

    #elapsed-date {
      margin-top: 8px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
    }

    .divider {
      width: 70px;
      height: 1px;
      margin: 0 auto 36px;
      background: var(--border);
    }

    .quote-card {
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    #quote {
      margin: 0 0 24px;
      font-size: clamp(1.35rem, 4vw, 2rem);
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    #leader {
      margin: 0;
      color: var(--accent);
      font-size: 1rem;
      line-height: 1.6;
    }

    #work {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    #source {
      display: inline-block;
      margin-top: 12px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.8rem;
      overflow-wrap: anywhere;
    }

    .quote-status {
      margin-top: 22px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
      line-height: 1.6;
    }

    footer {
      margin-top: 34px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    a {
      color: var(--accent);
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .subtitle {
        margin-bottom: 32px;
      }

      .timer-section {
        margin-bottom: 32px;
      }

      .quote-card {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Siempre</h1>
    <p class="subtitle">Always · Forever</p>

    <section class="timer-section">
      <div class="section-label">Time elapsed</div>
      <div id="elapsed" aria-live="off">Loading…</div>
      <div id="elapsed-date"></div>
    </section>

    <div class="divider"></div>

    <section class="quote-card" aria-label="Quote of the moment">
      <blockquote id="quote">Loading quote…</blockquote>
      <p id="leader"></p>
      <p id="work"></p>
      <a id="source" hidden target="_blank" rel="noopener noreferrer">
        Read source
      </a>

      <div class="quote-status">
        Quote <span id="quote-number">—</span> of
        <span id="quote-total">—</span>
        <br>
        Changes in <span id="next-change">—</span>
      </div>
    </section>

    <footer>Siempre</footer>
  </main>

  <script>
    "use strict";

    /*
      Shared configuration
      --------------------
      Keep these values identical across devices.

      The start time anchors both the elapsed timer and the
      8-hour quote rotation. Do not change it if you want
      all devices to stay synchronized with the same schedule.
    */
    const START_TIME = new Date(
      "2026-10-15T02:57:00+05:30"
    ).getTime();

    const QUOTE_INTERVAL_MS = 8 * 60 * 60 * 1000;

    /*
      Fixed seed for a deterministic shuffle.

      Every device runs the same shuffle algorithm with the
      same seed and the same quotes.json, so the order matches.
      No browser storage is used.
    */
    const SHUFFLE_SEED = 20261015;

    const $ = (id) => document.getElementById(id);

    let quotes = [];
    let quoteOrder = [];

    function seededRandom(seed) {
      let state = seed >>> 0;

      return function () {
        state = (state + 0x6D2B79F5) >>> 0;

        let value = state;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(
          value ^ (value >>> 7),
          value | 61
        );

        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    function createQuoteOrder(count) {
      const order = Array.from(
        { length: count },
        (_, index) => index
      );

      const random = seededRandom(SHUFFLE_SEED);

      // Deterministic Fisher-Yates shuffle.
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }

      return order;
    }

    function getQuotePosition(now = Date.now()) {
      const elapsedIntervals = Math.floor(
        (now - START_TIME) / QUOTE_INTERVAL_MS
      );

      // Before the start time, use the first quote in the order.
      const intervalNumber = Math.max(0, elapsedIntervals);

      return {
        intervalNumber,
        position: intervalNumber % quoteOrder.length,
        nextChange:
          START_TIME +
          (intervalNumber + 1) * QUOTE_INTERVAL_MS
      };
    }

    function renderQuote(now = Date.now()) {
      if (quotes.length === 0 || quoteOrder.length === 0) {
        return;
      }

      const { intervalNumber, position, nextChange } =
        getQuotePosition(now);

      const quote = quotes[quoteOrder[position]];

      $("quote").textContent = quote.quote || "";
      $("leader").textContent = quote.leader
        ? `— ${quote.leader}`
        : "";

      $("work").textContent = quote.work || "";

      const source = $("source");

      if (quote.source) {
        source.href = quote.source;
        source.hidden = false;
      } else {
        source.removeAttribute("href");
        source.hidden = true;
      }

      $("quote-number").textContent =
        String(position + 1);

      $("quote-total").textContent =
        String(quotes.length);

      updateCountdown(nextChange, now);
    }

    function formatDuration(totalSeconds) {
      const seconds = Math.max(0, Math.floor(totalSeconds));

      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainingSeconds = seconds % 60;

      return `${days}d ${String(hours).padStart(2, "0")}:` +
        `${String(minutes).padStart(2, "0")}:` +
        `${String(remainingSeconds).padStart(2, "0")}`;
    }

    function updateTimer(now = Date.now()) {
      const elapsedSeconds = Math.max(
        0,
        (now - START_TIME) / 1000
      );

      $("elapsed").textContent =
        formatDuration(elapsedSeconds);

      $("elapsed-date").textContent =
        "Since " +
        new Date(START_TIME).toLocaleString(undefined, {
          dateStyle: "long",
          timeStyle: "short"
        });
    }

    function updateCountdown(nextChange, now = Date.now()) {
      const remainingSeconds = Math.max(
        0,
        (nextChange - now) / 1000
      );

      $("next-change").textContent =
        formatDuration(remainingSeconds);
    }

    async function loadQuotes() {
      try {
        const response = await fetch("./quotes.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `Could not load quotes.json (${response.status})`
          );
        }

        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          throw new Error(
            "quotes.json must contain a non-empty JSON array."
          );
        }

        quotes = data.filter(
          item =>
            item &&
            typeof item.quote === "string" &&
            item.quote.trim().length > 0
        );

        if (quotes.length === 0) {
          throw new Error(
            "No valid quotes were found in quotes.json."
          );
        }

        quoteOrder = createQuoteOrder(quotes.length);

        renderQuote();
      } catch (error) {
        console.error(error);
        $("quote").textContent =
          "Unable to load quotes. Check that quotes.json is " +
          "in the same folder as index.html.";
        $("leader").textContent = "";
        $("work").textContent = "";
        $("source").hidden = true;
        $("quote-status");
      }
    }

    function updatePage() {
      const now = Date.now();

      updateTimer(now);

      if (quotes.length > 0) {
        renderQuote(now);
      }
    }

    // Refresh when returning to a backgrounded tab or device.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        updatePage();
      }
    });

    // Recalculate from the shared timestamp; no saved state needed.
    updateTimer();
    loadQuotes();

    // The page derives the active quote from the current time.
    // It does not rely on how often this interval runs.
    setInterval(updatePage, 1000);
  </script>
</body>
</html>
