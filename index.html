<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />

  <title>WADTD!!</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --card: #11151d;
      --border: #252c38;
      --text: #f1f5f9;
      --muted: #8993a4;
      --accent: #67e8f9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(34, 211, 238, 0.07),
          transparent 55%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: min(680px, 100%);
    }

    .header {
      margin-bottom: 32px;
      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(103, 232, 249, 0.65);
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 650;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .unit {
      min-width: 0;
      padding: 25px 8px 22px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color 180ms ease;
    }

    .unit:hover {
      border-color: #3c5363;
    }

    .number {
      display: block;
      font-size: clamp(25px, 5.5vw, 38px);
      font-weight: 550;
      line-height: 1.2;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .label {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .footer {
      margin-top: 25px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    .footer span {
      color: #cbd5e1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .header {
        margin-bottom: 25px;
      }

      .timer {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .unit {
        padding: 24px 8px 20px;
      }

      .number {
        font-size: 34px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span>Live counter</span>
      </div>

      <h1>WADTD<span style="color: var(--accent)">!!</span></h1>

      <p class="subtitle">
        Every second counts.
      </p>
    </header>

    <section class="timer" aria-label="Elapsed time">
      <div class="unit">
        <span class="number" id="days">0</span>
        <span class="label">Days</span>
      </div>

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <footer class="footer">
      Started on <span>14 October 2026 · 12:03:35 AM IST</span>
      <br />
      <span>Time elapsed since the beginning.</span>
    </footer>
  </main>

  <script>
    // Fixed activation time: 14 October 2026, 00:03:35 IST.
    // IST is UTC+05:30.
    const START_TIME = new Date(
      "2026-10-14T00:03:35+05:30"
    ).getTime();

    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    const pad = (value) => String(value).padStart(2, "0");

    function updateTimer() {
      // Calculate from the real clock, not from the number of
      // interval callbacks. This prevents accumulated drift.
      const elapsed = Math.max(0, Date.now() - START_TIME);

      const totalSeconds = Math.floor(elapsed / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      elements.days.textContent = days;
      elements.hours.textContent = pad(hours);
      elements.minutes.textContent = pad(minutes);
      elements.seconds.textContent = pad(seconds);
    }

    // Render immediately; don't wait for the first interval.
    updateTimer();

    // Refresh the display every second without reloading.
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
